name: StageBook tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: stagebook-ci-only
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pstagebook-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      STAGEBOOK_TEST_URL: mysql+mysqlconnector://root:stagebook-ci-only@127.0.0.1:3306/StageBook
      MYSQL_PWD: stagebook-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Initialize disposable database
        run: |
          mysql -h 127.0.0.1 -uroot -e "SET GLOBAL log_bin_trust_function_creators=1; SET GLOBAL time_zone='+08:00';"
          mysql -h 127.0.0.1 -uroot --default-character-set=utf8mb4 < stagebook_code/main_code.sql
          mysql -h 127.0.0.1 -uroot --default-character-set=utf8mb4 < stagebook_code/StageBook_insert_data.sql > /dev/null
      - run: python -m pytest -q
